[project]
name = "qe-api"
version = "0.1.0"
description = "API e servidor local: páginas e dados de serving de cada funcionalidade"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "qe-core",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
qe-core = { workspace = true }
