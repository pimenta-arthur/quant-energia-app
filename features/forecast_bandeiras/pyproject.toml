[project]
name = "qe-forecast-bandeiras"
version = "0.1.0"
description = "Funcionalidade: projeção de bandeiras tarifárias (ingestão, tratamento, projeção e publicação)"
requires-python = ">=3.14"
dependencies = [
    "qe-core",
    "scipy>=1.18.1",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
qe-core = { workspace = true }
